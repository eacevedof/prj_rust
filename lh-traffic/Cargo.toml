[package]
name = "lh-traffic"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
dotenv = "0.15"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
once_cell = "1.19"
regex = "1.0"
md5 = "0.7"
rand = "0.8"

# HTTP Client
reqwest = { version = "0.11", features = ["json"] }

# CLI
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"

[lib]
name = "lh_traffic"
path = "src/lib.rs"

[[bin]]
name = "network_traffic"
path = "src/bin/network_traffic.rs"

[[bin]]
name = "list-network-connections"
path = "src/bin/list_network_connections.rs"

[[bin]]
name = "watch-network-connections"
path = "src/bin/watch_network_connections.rs"

[[bin]]
name = "test-macros"
path = "src/bin/test_macros.rs"

[[bin]]
name = "enhanced-network-info"
path = "src/bin/enhanced_network_info.rs"

[[bin]]
name = "whois-network-info"
path = "src/bin/whois_network_info.rs"

[[bin]]
name = "list-enhanced-network-connections"
path = "src/bin/list_enhanced_network_connections.rs"

[dev-dependencies]
